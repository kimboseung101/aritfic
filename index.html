<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Manager</title>
    <!-- Google Fonts: Poppins (제목), Noto Sans KR (본문) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- CSS 변수 및 기본 스타일 --- */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent-color: #007bff; /* 기존 파란색 유지 */
            --accent-hover: #0056b3;
            --border-color: #e0e0e0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --font-family-base: 'Noto Sans KR', sans-serif;
            --font-family-title: 'Poppins', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- 헤더 --- */
        header {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: var(--font-family-title);
            font-weight: 600;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        /* --- 메인 레이아웃 (스캐너 + 대시보드) --- */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr; /* 스캐너 1 : 그래프 영역 1.5 비율 */
            gap: 30px;
        }

        @media (max-width: 992px) {
            .main-layout {
                grid-template-columns: 1fr; /* 화면이 작아지면 세로로 배치 */
            }
        }

        /* 공통 카드 스타일 */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 30px;
        }

        .card-title {
            font-family: var(--font-family-title);
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- 1. 기구 인식 스캐너 영역 (기존 기능 유지 및 디자인 개선) --- */
        .scanner-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .camera-preview {
            width: 100%;
            height: 300px; /* 고정 높이 유지 */
            background-color: #2c2c2c; /* 기존 어두운 배경 유지 */
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 0.9rem;
            border: 2px dashed var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .camera-preview::after {
            content: '📹 카메라 대기 중';
        }

        .camera-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none; /* 이미지 업로드 전 숨김 */
        }

        .scan-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 20px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-family: var(--font-family-base);
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        .scan-btn:hover {
            background-color: var(--accent-hover);
        }

        .scan-btn:active {
            transform: translateY(1px);
        }

        .result-panel {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .result-panel h3 {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .result-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .result-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 5px;
        }


        /* --- 2. 그래프 대시보드 영역 --- */
        .dashboard-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .graph-card {
            height: 300px; /* 각 그래프 카드의 고정 높이 */
            position: relative;
        }

        /* --- 3. 푸터 --- */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Fitness Manager</h1>
        <span>👋 홍길동님</span>
    </header>

    <div class="main-layout">
        <!-- 왼쪽: 기구 인식 스캐너 섹션 -->
        <div class="scanner-section card">
            <h2 class="card-title">🔍 AI 기구 인식 스캐너</h2>
            
            <div class="camera-preview" id="cameraPreview">
                <!-- 실제 카메라 영상 또는 업로드된 이미지가 들어갈 곳 -->
                <img id="scannedImage" src="" alt="스캔된 기구">
            </div>

            <!-- 실제 기능 구현을 위한 숨겨진 파일 입력 -->
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            
            <button class="scan-btn" onclick="document.getElementById('fileInput').click()">
                기구 사진 업로드 및 스캔
            </button>

            <div class="result-panel" id="resultPanel" style="display: none;">
                <h3>인식된 헬스 기구</h3>
                <p class="result-text"><span class="result-label">기구명:</span><span id="machineName">-</span></p>
                <p class="result-text"><span class="result-label">사용법:</span><span id="usageInfo">-</span></p>
                <p class="result-text"><span class="result-label">주의사항:</span><span id="cautionInfo">-</span></p>
            </div>
        </div>

        <!-- 오른쪽: 신체 데이터 그래프 대시보드 섹션 -->
        <div class="dashboard-section">
            <!-- 그래프 1: 이중 꺽은선 그래프 (몸무게 & 운동량) -->
            <div class="card graph-card">
                <h3 class="card-title">📈 체중 & 운동량 변화</h3>
                <canvas id="weightWorkoutChart"></canvas>
            </div>

            <!-- 그래프 2: 꺽은선 그래프 (체지방률) -->
            <div class="card graph-card">
                <h3 class="card-title">📉 체지방률 (%)</h3>
                <canvas id="bodyFatChart"></canvas>
            </div>

            <!-- 그래프 3: 꺽은선 그래프 (키) -->
            <div class="card graph-card">
                <h3 class="card-title">📏 키 (cm)</h3>
                <canvas id="heightChart"></canvas>
            </div>
        </div>
    </div>

    <footer>
        © 2024 AI Fitness Pro. All rights reserved.
    </footer>
</div>

<script>
    // --- 자바스크립트: 기능 구현 및 그래프 데이터 ---

    // [기능] 파일 업로드 시 미리보기 및 결과 표시 시뮬레이션
    const fileInput = document.getElementById('fileInput');
    const cameraPreview = document.getElementById('cameraPreview');
    const scannedImage = document.getElementById('scannedImage');
    const resultPanel = document.getElementById('resultPanel');
    const machineName = document.getElementById('machineName');
    const usageInfo = document.getElementById('usageInfo');
    const cautionInfo = document.getElementById('cautionInfo');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // 이미지 미리보기 표시
                scannedImage.src = e.target.result;
                scannedImage.style.display = 'block';
                
                // 카메라 아이콘 숨기기
                cameraPreview.style.border = 'none';
                cameraPreview.querySelector('color').style.display = 'none';

                // 결과 패널 표시 (실제 앱에서는 AI 분석 결과로 채워짐)
                showMockResult();
            }
            reader.readAsDataURL(file);
        }
    });

    // [기능] 가짜 결과 데이터 표시 함수
    function showMockResult() {
        resultPanel.style.display = 'block';
        // 시뮬레이션 데이터
        machineName.innerText = "덤벨 프레스 머신";
        usageInfo.innerText = "벤치에 누워 손잡이를 잡고 가슴 근육 힘으로 밀어 올립니다.";
        cautionInfo.innerText = "허리가 과도하게 꺾이지 않도록 주의하세요. 팔꿈치 관절을 완전히 펴지 마세요.";
    }


    // --- Chart.js 설정 ---
    Chart.defaults.font.family = "'Noto Sans KR', sans-serif";
    Chart.defaults.color = '#666666';
    Chart.defaults.scale.grid.color = '#f0f0f0';

    // 공통 옵션 (반응형)
    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false, // 부모 div 높이에 맞춤
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    boxWidth: 12,
                    usePointStyle: true,
                    padding: 15
                }
            },
            tooltip: {
                mode: 'index',
                intersect: false,
                backgroundColor: 'rgba(0,0,0,0.8)',
                titleFont: { family: "'Poppins', sans-serif" },
                cornerRadius: 8
            }
        },
        interaction: {
            mode: 'nearest',
            axis: 'x',
            intersect: false
        },
        scales: {
            x: {
                grid: { display: false } // X축 격자선 숨김
            },
            y: {
                beginAtZero: false
            }
        }
    };

    // [그래프 1] 몸무게 & 운동량 (이중 꺽은선)
    const ctx1 = document.getElementById('weightWorkoutChart').getContext('2d');
    new Chart(ctx1, {
        type: 'line',
        data: {
            labels: ['5월 1일', '5월 8일', '5월 15일', '5월 22일', '5월 29일'], // 날짜 데이터
            datasets: [
                {
                    label: '몸무게 (kg)',
                    data: [75.2, 74.8, 75.5, 74.1, 73.9],
                    borderColor: '#007bff', // 파란색
                    backgroundColor: 'rgba(0, 123, 255, 0.1)',
                    yAxisID: 'y', // 첫 번째 Y축 사용
                    tension: 0.3, // 부드러운 곡선
                    pointRadius: 4
                },
                {
                    label: '총 운동량 (점수)',
                    data: [180, 210, 195, 230, 250],
                    borderColor: '#28a745', // 초록색
                    backgroundColor: 'rgba(40, 167, 69, 0.05)',
                    yAxisID: 'y1', // 두 번째 Y축 사용
                    borderDash: [5, 5], // 점선 스타일
                    tension: 0.3,
                    pointRadius: 4
                }
            ]
        },
        options: {
            ...commonOptions,
            scales: {
                ...commonOptions.scales,
                // 이중 Y축 설정
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: { display: true, text: '몸무게 (kg)' }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    title: { display: true, text: '운동량 점수' },
                    grid: { drawOnChartArea: false } // 오른쪽 축은 격자선 숨김
                }
            }
        }
    });

    // [그래프 2] 체지방률 (%)
    const ctx2 = document.getElementById('bodyFatChart').getContext('2d');
    new Chart(ctx2, {
        type: 'line',
        data: {
            labels: ['5월 1일', '5월 8일', '5월 15일', '5월 22일', '5월 29일'],
            datasets: [{
                label: '체지방률 (%)',
                data: [22.1, 21.8, 22.5, 21.1, 20.9],
                borderColor: '#dc3545', // 빨간색
                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                tension: 0.4,
                fill: true // 영역 채우기
            }]
        },
        options: {
            ...commonOptions,
            scales: {
                ...commonOptions.scales,
                y: { title: { display: true, text: '체지방 (%)' } }
            }
        }
    });

    // [그래프 3] 키 (cm)
    const ctx3 = document.getElementById('heightChart').getContext('2d');
    new Chart(ctx3, {
        type: 'line',
        data: {
            labels: ['5월 1일', '5월 8일', '5월 15일', '5월 22일', '5월 29일'],
            datasets: [{
                label: '키 (
